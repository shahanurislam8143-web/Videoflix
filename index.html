<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও ফ্লিক্স - Video Streaming</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ef4444;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 100px; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: var(--card-bg); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 20px; font-weight: bold; color: var(--accent-color); }
        .sub-btn { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .badge-vip { background: #f59e0b; color: #000; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: none; }

        .categories {
            display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; background: var(--card-bg);
            white-space: nowrap; scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-chip { background: #334155; color: var(--text-color); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .cat-chip.active { background: var(--accent-color); }

        .video-container { padding: 15px; display: grid; grid-template-columns: 1fr; gap: 15px; }
        .video-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; cursor: pointer; }
        .thumbnail { width: 100%; height: 180px; background: #334155; object-fit: cover; }
        .video-info { padding: 10px; }
        .video-title { font-size: 16px; font-weight: 500; margin-bottom: 5px; }
        .video-meta { font-size: 12px; color: var(--text-muted); }

        /* Ads Banners Containers */
        .header-ad-box { width: 100%; min-height: 70px; background: #1e293b; text-align: center; border-bottom: 1px solid #334155; overflow: hidden; }
        .footer-sticky-ad { position: fixed; bottom: 0; left: 0; width: 100%; min-height: 60px; background: #0f172a; border-top: 2px solid var(--accent-color); z-index: 999; text-align: center; overflow: hidden; }
        .infeed-ad-box { width: 100%; min-height: 100px; background: #1e293b; border-radius: 8px; text-align: center; overflow: hidden; padding: 5px; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; }
        .close-btn { background: var(--accent-color); color: white; border: none; padding: 10px 16px; margin-top: 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        
        select, input { width: 100%; padding: 10px; background: #334155; border: none; color: white; border-radius: 4px; margin-bottom: 10px; }

        .fixed-ad-box { background: #334155; width: 100%; height: 250px; display: flex; align-items: center; justify-content: center; border-radius: 6px; overflow: hidden; }
        iframe.ad-iframe { width: 100%; height: 100%; border: none; overflow: hidden; }
    </style>
</head>
<body onclick="triggerPopupAd()">

    <header>
        <div class="logo">🎥 VideoFlix</div>
        <div>
            <span id="vipBadge" class="badge-vip">⭐ VIP User</span>
            <button class="sub-btn" id="subHeaderBtn" onclick="openSubscription()">সাবস্ক্রিপশন নিন</button>
        </div>
    </header>

    <!-- Header Banner Ad Space -->
    <div class="header-ad-box" id="headerAdContainer"></div>

    <div class="categories">
        <div class="cat-chip active" onclick="filterCategory('all', this)">সব</div>
        <div class="cat-chip" onclick="filterCategory('viral', this)">ভাইরাল ভিডিও</div>
        <div class="cat-chip" onclick="filterCategory('trending', this)">ট্রেণ্ডি ভিডিও</div>
        <div class="cat-chip" onclick="filterCategory('new', this)">নতুন ভিডিও</div>
    </div>

    <div class="video-container" id="videoList"></div>

    <!-- Footer Sticky Banner Ad Space -->
    <div class="footer-sticky-ad" id="footerAdContainer"></div>

    <!-- Popup Code Executer Space -->
    <div id="popupAdScriptSpace" style="display:none;"></div>

    <!-- Pre-Roll Ad Modal -->
    <div class="modal" id="adModal">
        <div class="modal-content">
            <h3 id="adTitle">বিজ্ঞাপন চলছে...</h3>
            <p id="adTimer" style="margin: 12px 0; color: #f59e0b; font-weight: bold;">অপেক্ষা করুন...</p>
            
            <div class="fixed-ad-box">
                <iframe id="adIframe" class="ad-iframe"></iframe>
            </div>

            <button class="close-btn" id="skipAdBtn" disabled style="opacity: 0.5;">অপেক্ষা করুন...</button>
        </div>
    </div>

    <!-- Subscription Modal -->
    <div class="modal" id="subModal">
        <div class="modal-content" style="text-align: left;">
            <h3 style="text-align: center; margin-bottom: 15px;">ভিআইপি সাবস্ক্রিপশন প্ল্যান</h3>
            
            <p style="font-size: 13px; margin-bottom: 5px; color: var(--text-muted);">বিকাশ/নগদ (Personal): <b style="color:white;" id="bkashDisplay">01700-000000</b></p>
            <p style="font-size: 13px; margin-bottom: 10px; color: var(--text-muted);">বাইনান্স (Binance Pay ID / USDT): <b style="color:#f59e0b;" id="binanceDisplay">বাইনান্স আইডি সেট করা হয়নি</b></p>
            
            <label style="font-size: 13px; color: var(--text-muted);">প্যাকেজ সিলেক্ট করুন:</label>
            <select id="subPlan">
                <option value="1">১ মাস - ১০০ টাকা</option>
                <option value="5">৫ মাস - ৩০০ টাকা</option>
                <option value="12">১ বছর - ১০০০ টাকা</option>
            </select>

            <input type="text" id="userPhone" placeholder="আপনার মোবাইল নম্বর বা বাইনান্স অ্যাকাউন্ট">
            <input type="text" id="trxId" placeholder="TrxID অথবা Binance Order ID দিন">
            
            <label style="font-size: 13px; color: var(--text-muted);">পেমেন্টের স্ক্রিনশট দিন (প্রমাণ):</label>
            <input type="file" id="paymentScreenshot" accept="image/*">
            
            <button class="sub-btn" style="width: 100%; padding: 10px;" onclick="submitPayment()">সাবমিট করুন</button>
            <button class="close-btn" style="width: 100%; background: #475569; margin-top: 10px;" onclick="closeSubscription()">বন্ধ করুন</button>
        </div>
    </div>

    <script>
        const DB_URL = "https://viral-602ed-default-rtdb.firebaseio.com";

        let isVipActive = false;
        let videos = [];
        let currentFilter = 'all';
        let adsData = {};
        let popupTriggered = false;

        async function loadDataFromCloud() {
            try {
                let setRes = await fetch(`${DB_URL}/settings.json`);
                let settings = await setRes.json();
                if(settings) {
                    if(settings.bkash) document.getElementById('bkashDisplay').innerText = settings.bkash;
                    if(settings.binance) document.getElementById('binanceDisplay').innerText = settings.binance;
                    if(settings.ads) {
                        adsData = settings.ads;
                        injectHeaderFooterAds();
                    }
                }

                let vidRes = await fetch(`${DB_URL}/videos.json`);
                let vidData = await vidRes.json();
                if(vidData) {
                    videos = Object.values(vidData);
                    renderVideos(currentFilter);
                } else {
                    videos = [];
                    renderVideos(currentFilter);
                }

                checkVipStatus();
            } catch(e) { console.error(e); }
        }

        // সাধারণ এলিমেন্টে অ্যাড ইঞ্জেক্ট করা
        function injectAdHtml(elementId, code) {
            const container = document.getElementById(elementId);
            if (!container || !code) return;
            container.innerHTML = '';
            const range = document.createRange();
            range.selectNode(container);
            const fragment = range.createContextualFragment(code);
            container.appendChild(fragment);
        }

        function injectHeaderFooterAds() {
            if(isVipActive) return;
            if(adsData.header) injectAdHtml('headerAdContainer', adsData.header);
            if(adsData.footer) injectAdHtml('footerAdContainer', adsData.footer);
        }

        function triggerPopupAd() {
            if(!popupTriggered && adsData.popup && !isVipActive) {
                popupTriggered = true;
                injectAdHtml('popupAdScriptSpace', adsData.popup);
            }
        }

        // মডালের ভেতর iframe দিয়ে ভিডিও অ্যাড লোড করা
        function renderAdInsideModal() {
            const iframe = document.getElementById('adIframe');
            if (!iframe) return;

            let iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            
            let htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { margin:0; padding:0; background:#334155; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; color:#fff; font-family:sans-serif; }
                    </style>
                </head>
                <body>
                    ${adsData.modal ? adsData.modal : (adsData.header ? adsData.header : '<p style="color:#94a3b8; font-size:14px;">[বিজ্ঞাপন লোড হচ্ছে...]</p>')}
                </body>
                </html>
            `;

            iframeDoc.write(htmlContent);
            iframeDoc.close();
        }

        async function checkVipStatus() {
            const userPhone = localStorage.getItem('myPhone');
            if(userPhone) {
                let res = await fetch(`${DB_URL}/approved_users/${userPhone}.json`);
                let data = await res.json();
                
                if(data && data.expiry) {
                    const now = new Date().getTime();
                    if(now < data.expiry) {
                        isVipActive = true;
                        document.getElementById('vipBadge').style.display = 'inline-block';
                        document.getElementById('subHeaderBtn').innerText = 'প্রিমিয়াম সক্রিয়';
                        document.getElementById('subHeaderBtn').style.background = '#64748b';
                        document.getElementById('headerAdContainer').style.display = 'none';
                        document.getElementById('footerAdContainer').style.display = 'none';
                        return;
                    }
                }
            }
            isVipActive = false;
            document.getElementById('vipBadge').style.display = 'none';
            document.getElementById('subHeaderBtn').innerText = 'সাবস্ক্রিপশন নিন';
            document.getElementById('subHeaderBtn').style.background = '#10b981';
        }

        function renderVideos(filter) {
            currentFilter = filter;
            const container = document.getElementById('videoList');
            container.innerHTML = '';
            const filtered = filter === 'all' ? videos : videos.filter(v => v.category === filter);
            
            if(filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted); grid-column: 1/-1;">কোনো ভিডিও পাওয়া যায়নি</p>`;
                return;
            }

            filtered.forEach((video, index) => {
                container.innerHTML += `
                    <div class="video-card" onclick="handleVideoClick('${video.url}')">
                        <img src="${video.thumb}" class="thumbnail" alt="thumb">
                        <div class="video-info">
                            <div class="video-title">${video.title}</div>
                            <div class="video-meta">ক্যাটাগরি: ${video.category.toUpperCase()}</div>
                        </div>
                    </div>
                `;

                // প্রতি ২টি ভিডিওর পর ইন-ফিড ব্যানার অ্যাড
                if(!isVipActive && adsData.infeed && (index + 1) % 2 === 0) {
                    container.innerHTML += `<div class="infeed-ad-box" id="infeed-ad-${index}"></div>`;
                    setTimeout(() => { injectAdHtml(`infeed-ad-${index}`, adsData.infeed); }, 300);
                }
            });
        }

        function filterCategory(cat, element) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderVideos(cat);
        }

        function handleVideoClick(url) {
            if (isVipActive) {
                window.location.href = url; 
            } else {
                startPreRollAds(url);
            }
        }

        function startPreRollAds(url) {
            const modal = document.getElementById('adModal');
            modal.style.display = 'flex';
            renderAdInsideModal();

            runSingleAd(1, "প্রথম বিজ্ঞাপন", 10, () => {
                renderAdInsideModal();
                runSingleAd(2, "দ্বিতীয় বিজ্ঞাপন", 10, () => {
                    modal.style.display = 'none';
                    window.location.href = url;
                });
            });
        }

        function runSingleAd(adNumber, adName, duration, onComplete) {
            const adTitle = document.getElementById('adTitle');
            const timerText = document.getElementById('adTimer');
            const skipBtn = document.getElementById('skipAdBtn');
            
            adTitle.innerText = `${adName} (${adNumber}/২) চলছে...`;
            let timeLeft = duration; 
            skipBtn.disabled = true;
            skipBtn.style.opacity = 0.5;
            skipBtn.innerText = "অপেক্ষা করুন...";

            const countdown = setInterval(() => {
                timeLeft--;
                timerText.innerText = `বিজ্ঞাপন শেষ হতে ${timeLeft} সেকেন্ড বাকি...`;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerText.innerText = `${adName} সম্পন্ন!`;
                    skipBtn.disabled = false;
                    skipBtn.style.opacity = 1;
                    skipBtn.innerText = adNumber === 1 ? "পরবর্তী বিজ্ঞাপন দেখুন ➡️" : "ভিডিও দেখুন ▶️";
                    skipBtn.onclick = () => { onComplete(); };
                }
            }, 1000);
        }

        function openSubscription() { if(!isVipActive) document.getElementById('subModal').style.display = 'flex'; }
        function closeSubscription() { document.getElementById('subModal').style.display = 'none'; }
        
        async function submitPayment() {
            const phone = document.getElementById('userPhone').value.trim();
            const trx = document.getElementById('trxId').value.trim();
            const planMonths = document.getElementById('subPlan').value;
            const fileInput = document.getElementById('paymentScreenshot');

            if(!phone || !trx) {
                alert("দয়া করে নম্বর/অ্যাকাউন্ট এবং TrxID দিন।");
                return;
            }

            if(fileInput.files.length === 0) {
                alert("দয়া করে পেমেন্টের স্ক্রিনশট আপলোড করুন!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(event) {
                const base64Image = event.target.result;
                const uniqueKey = phone.replace(/[^a-zA-Z0-9]/g, '_');

                localStorage.setItem('myPhone', uniqueKey);
                
                try {
                    await fetch(`${DB_URL}/payments/${uniqueKey}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            phone: phone, 
                            trx: trx, 
                            months: planMonths, 
                            screenshot: base64Image, 
                            date: new Date().toLocaleDateString() 
                        })
                    });

                    alert("পেমেন্ট সফলভাবে জমা হয়েছে!");
                    closeSubscription();
                } catch(e) {
                    alert("পেমেন্ট জমা করা যায়নি!");
                }
            };

            reader.readAsDataURL(file);
        }

        loadDataFromCloud();
    </script>
</body>
</html>
